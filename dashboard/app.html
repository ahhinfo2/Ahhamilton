<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Tableau de bord | AHH</title>
  <!-- Preconnect pour Google Fonts (réduit la latence) -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/jpeg" href="../Public/logo1.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#1b5e20"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="AHH"/>
  <link rel="apple-touch-icon" href="../Public/logo1.png"/>
  <link rel="stylesheet" href="dashboard.css"/>
  <!-- CSS skeleton inline pour affichage immédiat -->
  <style>
    .sk{background:linear-gradient(90deg,#e8f5e9 25%,#c8e6c9 50%,#e8f5e9 75%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:8px}
    @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .sk-wrap{padding:20px;display:flex;flex-direction:column;gap:16px}
    .sk-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
    .sk-card{height:90px;border-radius:10px}
    .sk-line{height:14px;border-radius:6px;margin-bottom:8px}
    .sk-line.w60{width:60%} .sk-line.w40{width:40%} .sk-line.w80{width:80%}
    .sk-greeting{height:120px;border-radius:14px;margin-bottom:20px}
    .sk-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
    .sk-box{height:200px;border-radius:12px}
    @media(max-width:600px){.sk-cards{grid-template-columns:1fr 1fr}.sk-grid{grid-template-columns:1fr}}
  </style>
  <!-- Chart.js chargé en différé -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js" defer></script>
</head>
<body>

<!-- ── BARRE UNIQUE ────────────────────────────────────────────────────── -->
<div class="site-nav-strip" id="siteNavStrip">
  <div class="site-nav-inner">
    <!-- Logo gauche -->
    <button class="hamburger-dash" id="sidebarToggle">☰</button>
    <button onclick="window.location.href='../index.html'" class="mobile-home-btn" title="Site AHH">
      <img src="../Public/logo1.png" alt="" class="mobile-home-img" onerror="this.style.display='none'"/>
      <span>AHH</span>
    </button>
    <button onclick="window.location.href='../index.html'" class="site-nav-logo" style="background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;gap:6px;text-decoration:none" title="Site AHH">
      <img src="../Public/logo1.png" alt="AHH" class="site-nav-logo-img"/>
      <span>AHH</span>
    </button>
    <!-- Nav centrée -->
    <nav class="site-nav-links">
      <a href="../actualites.html">Activités</a>
      <a href="../galerie.html">Galerie</a>
      <a href="../equipe.html">Équipe</a>
      <a href="../index.html#don">Soutenir</a>
      <a href="../about.html">À propos</a>
    </nav>
    <!-- Droite : boutons + prénom + déco -->
    <div class="site-nav-user" id="siteNavUser">
      <div class="lang-selector" id="langSelectorWrap" onclick="event.stopPropagation()">
        <button class="icon-btn lang-btn" id="langBtn" title="Langue"
          onclick="document.getElementById('langSelectorWrap').classList.toggle('open')">
          🌐 <span id="langLabel">FR</span>
        </button>
        <div class="lang-dropdown" id="langDropdown">
          <div class="lang-dropdown-title">Langue / Language</div>
          <button class="lang-opt" data-lang="fr" onclick="if(window.AHH_LANG)AHH_LANG.set('fr');document.getElementById('langSelectorWrap').classList.remove('open')">🇫🇷 Français</button>
          <button class="lang-opt" data-lang="en" onclick="if(window.AHH_LANG)AHH_LANG.set('en');document.getElementById('langSelectorWrap').classList.remove('open')">🇬🇧 English</button>
          <button class="lang-opt" data-lang="ht" onclick="if(window.AHH_LANG)AHH_LANG.set('ht');document.getElementById('langSelectorWrap').classList.remove('open')">🇭🇹 Kreyòl</button>
        </div>
      </div>
      <button class="icon-btn" id="searchToggle" title="Recherche globale (Ctrl+K)" onclick="document.getElementById('searchWrap').style.display=document.getElementById('searchWrap').style.display==='none'?'block':'none';if(document.getElementById('searchWrap').style.display!=='none')document.getElementById('searchInput').focus()">🔍</button>
      <button class="icon-btn" id="darkToggle" title="Mode nuit">🌙</button>
      <button class="icon-btn" id="alertBtn" title="Alertes">🔔<span class="badge" id="alertCount" style="display:none"></span></button>
      <button class="icon-btn" id="msgBtn" title="Messages">✉️<span class="badge" id="msgCount" style="display:none"></span></button>
      <div class="user-chip" id="userChip"></div>
      <button class="site-nav-logout" id="siteNavLogout" onclick="logout()">⬅ Déco</button>
      <span id="siteNavName" style="display:none"></span>
    </div>
  </div>
</div>
<!-- Titre de page (caché, conservé pour la compatibilité JS) -->
<div id="topbarTitle" style="display:none">Tableau de bord</div>
<!-- Recherche globale Ctrl+K -->
<div id="searchWrap" style="display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:9999;width:min(600px,94vw)">
  <div style="position:relative">
    <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1rem;pointer-events:none">🔍</span>
    <input id="searchInput" type="text" autocomplete="off" placeholder="Rechercher un membre, activité, note… (Echap pour fermer)"
      style="width:100%;padding:14px 16px 14px 42px;font-size:.95rem;border-radius:14px;border:none;box-shadow:0 8px 40px rgba(0,0,0,.22);font-family:inherit;outline:none;background:#fff;color:#1c2b1c"/>
  </div>
  <div id="searchResults" style="display:none;background:#fff;border-radius:12px;margin-top:6px;box-shadow:0 8px 40px rgba(0,0,0,.18);overflow:hidden;max-height:400px;overflow-y:auto"></div>
</div>

<!-- ── SIDEBAR ──────────────────────────────────────────────────────────── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div id="sbAvatarSlot"></div>
    <span class="sb-name">Mon espace</span>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    <button class="btn-logout" id="btnLogout">⬅ Déconnexion</button>
  </div>
</aside>

<!-- ── MAIN ─────────────────────────────────────────────────────────────── -->
<div class="main-wrapper">
  <!-- Topbar supprimée (contenu fusionné dans site-nav-strip) -->

  <!-- Contenu principal — skeleton visible immédiatement avant JS -->
  <main class="content" id="mainContent">
    <div id="skeleton-screen" aria-hidden="true">
      <div class="sk sk-greeting"></div>
      <div class="sk-cards">
        <div class="sk sk-card"></div>
        <div class="sk sk-card"></div>
        <div class="sk sk-card"></div>
        <div class="sk sk-card"></div>
      </div>
      <div class="sk-grid">
        <div class="sk sk-box"></div>
        <div class="sk sk-box"></div>
        <div class="sk sk-box"></div>
      </div>
    </div>
  </main>
</div>

<!-- ── MODAL ────────────────────────────────────────────────────────────── -->
<div class="modal-overlay" id="modalOverlay" style="display:none">
  <div class="modal" id="modal">
    <div class="modal-header"><h3 id="modalTitle">Modal</h3><button class="modal-close" id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ── TOAST ────────────────────────────────────────────────────────────── -->
<div id="toast" class="toast" style="display:none" role="status" aria-live="polite"></div>

<!-- ── RECHERCHE FLOTTANTE MOBILE ───────────────────────────────────────── -->
<button class="mobile-fab" id="mobileFab" title="Recherche" onclick="document.getElementById('searchToggle').click()">🔍</button>

<!-- ── NAV MOBILE BAS DE PAGE ───────────────────────────────────────────── -->
<nav class="mobile-bottom-nav" id="mobileBottomNav">
  <div class="mbn-item" onclick="showView('home')" id="mbn-home"><div class="mbn-icon">🏠</div><div>Accueil</div></div>
  <div class="mbn-item" onclick="showView('activities')" id="mbn-activities"><div class="mbn-icon">🎉</div><div>Activités</div></div>
  <div class="mbn-item" onclick="showView('messages')" id="mbn-messages"><div class="mbn-icon">✉️</div><div>Messages</div></div>
  <div class="mbn-item" onclick="showView('profile')" id="mbn-profile"><div class="mbn-icon">👤</div><div>Profil</div></div>
  <div class="mbn-item" onclick="document.getElementById('sidebar').classList.toggle('open')" id="mbn-more"><div class="mbn-icon">☰</div><div>Menu</div></div>
</nav>

<script src="lang.js" defer></script>
<script src="dashboard.js" defer></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
