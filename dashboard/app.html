<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard – AHH</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/jpeg" href="../Public/logo1.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#1b5e20"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="AHH"/>
  <link rel="apple-touch-icon" href="../Public/logo1.png"/>
  <link rel="stylesheet" href="dashboard.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- ── BARRE UNIQUE ────────────────────────────────────────────────────── -->
<div class="site-nav-strip" id="siteNavStrip">
  <div class="site-nav-inner">
    <!-- Logo gauche -->
    <button class="hamburger-dash" id="sidebarToggle">☰</button>
    <a href="../index.html" class="site-nav-logo">
      <img src="../Public/logo1.png" alt="AHH" class="site-nav-logo-img"/>
      <span>AHH</span>
    </a>
    <!-- Nav centrée -->
    <nav class="site-nav-links">
      <a href="../actualites.html">Activités</a>
      <a href="../galerie.html">Galerie</a>
      <a href="../equipe.html">Équipe</a>
      <a href="../index.html#don">Soutenir</a>
      <a href="../about.html">À propos</a>
    </nav>
    <!-- Droite : boutons + prénom + déco -->
    <div class="site-nav-user" id="siteNavUser">
      <div class="lang-selector" id="langSelectorWrap" onclick="event.stopPropagation()">
        <button class="icon-btn lang-btn" id="langBtn" title="Langue"
          onclick="document.getElementById('langSelectorWrap').classList.toggle('open')">
          🌐 <span id="langLabel">FR</span>
        </button>
        <div class="lang-dropdown" id="langDropdown">
          <div class="lang-dropdown-title">Langue / Language</div>
          <button class="lang-opt" data-lang="fr" onclick="if(window.AHH_LANG)AHH_LANG.set('fr');document.getElementById('langSelectorWrap').classList.remove('open')">🇫🇷 Français</button>
          <button class="lang-opt" data-lang="en" onclick="if(window.AHH_LANG)AHH_LANG.set('en');document.getElementById('langSelectorWrap').classList.remove('open')">🇬🇧 English</button>
          <button class="lang-opt" data-lang="ht" onclick="if(window.AHH_LANG)AHH_LANG.set('ht');document.getElementById('langSelectorWrap').classList.remove('open')">🇭🇹 Kreyòl</button>
        </div>
      </div>
      <button class="icon-btn" id="darkToggle" title="Mode nuit">🌙</button>
      <button class="icon-btn" id="alertBtn" title="Alertes">🔔<span class="badge" id="alertCount" style="display:none"></span></button>
      <button class="icon-btn" id="msgBtn" title="Messages">✉️<span class="badge" id="msgCount" style="display:none"></span></button>
      <div class="user-chip" id="userChip"></div>
      <button class="site-nav-logout" id="siteNavLogout" onclick="logout()">⬅ Déco</button>
      <span id="siteNavName" style="display:none"></span>
    </div>
  </div>
</div>
<!-- Titre de page (caché, conservé pour la compatibilité JS) -->
<div id="topbarTitle" style="display:none">Tableau de bord</div>
<!-- Recherche globale (conservée, déplacée) -->
<div id="searchWrap" style="display:none">
  <input id="searchInput" type="text" autocomplete="off"/>
  <div id="searchResults" style="display:none"></div>
</div>

<!-- ── SIDEBAR ──────────────────────────────────────────────────────────── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <img src="../Public/logo1.png" alt="AHH" class="sb-logo-img"/>
    <span class="sb-name">Mon espace</span>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    <button class="btn-logout" id="btnLogout">⬅ Déconnexion</button>
  </div>
</aside>

<!-- ── MAIN ─────────────────────────────────────────────────────────────── -->
<div class="main-wrapper">
  <!-- Topbar supprimée (contenu fusionné dans site-nav-strip) -->

  <!-- Contenu principal -->
  <main class="content" id="mainContent">
    <div class="loading-screen"><div class="spinner"></div><p>Chargement...</p></div>
  </main>
</div>

<!-- ── MODAL ────────────────────────────────────────────────────────────── -->
<div class="modal-overlay" id="modalOverlay" style="display:none">
  <div class="modal" id="modal">
    <div class="modal-header"><h3 id="modalTitle">Modal</h3><button class="modal-close" id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ── TOAST ────────────────────────────────────────────────────────────── -->
<div id="toast" class="toast" style="display:none"></div>

<!-- ── NAV MOBILE BAS DE PAGE ───────────────────────────────────────────── -->
<nav class="mobile-bottom-nav" id="mobileBottomNav">
  <div class="mbn-item" onclick="showView('home')" id="mbn-home"><div class="mbn-icon">🏠</div><div>Accueil</div></div>
  <div class="mbn-item" onclick="showView('activities')" id="mbn-activities"><div class="mbn-icon">🎉</div><div>Activités</div></div>
  <div class="mbn-item" onclick="showView('messages')" id="mbn-messages"><div class="mbn-icon">✉️</div><div>Messages</div></div>
  <div class="mbn-item" onclick="showView('profile')" id="mbn-profile"><div class="mbn-icon">👤</div><div>Profil</div></div>
  <div class="mbn-item" onclick="document.getElementById('sidebar').classList.toggle('open')" id="mbn-more"><div class="mbn-icon">☰</div><div>Menu</div></div>
</nav>

<script src="lang.js"></script>
<script src="dashboard.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
