<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Réinitialiser le mot de passe | AHH</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--g1:#1b5e20;--g2:#2e7d32;--g3:#43a047;--white:#fff;--text:#1a2e1a;--muted:#5a7a5a;--border:#c8e6c9}
    body{font-family:'Poppins',sans-serif;min-height:100vh;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border-radius:20px;padding:48px 40px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
    .logo{text-align:center;margin-bottom:28px}
    .logo img{width:60px;height:60px;border-radius:14px;object-fit:cover;border:2px solid var(--border)}
    .logo h1{font-size:1.3rem;font-weight:700;color:var(--text);margin-top:12px}
    .logo p{color:var(--muted);font-size:.85rem;margin-top:4px}
    .form-group{margin-bottom:18px}
    label{display:block;font-size:.75rem;font-weight:700;color:var(--text);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
    input{width:100%;padding:12px 15px;border:1.5px solid var(--border);border-radius:10px;font-family:'Poppins',sans-serif;font-size:.88rem;color:var(--text);outline:none;transition:.2s}
    input:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(46,125,50,.1)}
    .btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--g2),var(--g3));color:#fff;border:none;border-radius:10px;font-family:'Poppins',sans-serif;font-size:.92rem;font-weight:600;cursor:pointer;transition:.25s;margin-top:4px}
    .btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(46,125,50,.35)}
    .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .msg{padding:12px 16px;border-radius:10px;font-size:.83rem;margin-bottom:16px;display:none}
    .msg.success{background:#e8f5e9;color:#1b5e20;border-left:3px solid var(--g2)}
    .msg.error{background:#fdecea;color:#c62828;border-left:3px solid #c62828}
    .link-row{text-align:center;margin-top:18px;font-size:.83rem;color:var(--muted)}
    .link-row a{color:var(--g2);font-weight:600}
    .invalid-token{text-align:center;padding:20px;display:none}
    .invalid-token .it-icon{font-size:3rem;margin-bottom:12px}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="../Public/logo1.png" alt="AHH"/>
      <h1>Nouveau mot de passe</h1>
      <p>Choisissez un nouveau mot de passe sécurisé.</p>
    </div>
    <div class="invalid-token" id="invalidToken">
      <div class="it-icon">⛔</div>
      <p>Ce lien est invalide ou expiré.</p>
      <div class="link-row" style="margin-top:12px"><a href="forgot-password.html">Demander un nouveau lien</a></div>
    </div>
    <div id="formWrap">
      <div class="msg" id="msgBox"></div>
      <form id="resetForm">
        <div class="form-group">
          <label>Nouveau mot de passe</label>
          <input type="password" id="pw1" placeholder="••••••••" required minlength="6"/>
        </div>
        <div class="form-group">
          <label>Confirmer le mot de passe</label>
          <input type="password" id="pw2" placeholder="••••••••" required minlength="6"/>
        </div>
        <button type="submit" class="btn" id="btn">Réinitialiser</button>
      </form>
    </div>
    <div class="link-row"><a href="login.html">← Retour à la connexion</a></div>
  </div>

  <script>
    const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:3001/api' : '/api';
    const token = new URLSearchParams(location.search).get('token');
    if (!token) { document.getElementById('formWrap').style.display='none'; document.getElementById('invalidToken').style.display='block'; }

    document.getElementById('resetForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msgBox = document.getElementById('msgBox');
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw1 !== pw2) {
        msgBox.className = 'msg error'; msgBox.textContent = 'Les mots de passe ne correspondent pas.'; msgBox.style.display='block'; return;
      }
      btn.disabled = true; btn.textContent = 'En cours...';
      try {
        const res = await fetch(`${API}/auth/reset-password`, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ token, new_password: pw1 })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        msgBox.className = 'msg success';
        msgBox.textContent = 'Mot de passe réinitialisé ! Redirection...';
        msgBox.style.display = 'block';
        document.getElementById('resetForm').style.display='none';
        setTimeout(() => location.href = 'login.html', 2500);
      } catch(ex) {
        if (ex.message.includes('invalide') || ex.message.includes('expiré')) {
          document.getElementById('formWrap').style.display='none';
          document.getElementById('invalidToken').style.display='block';
        } else {
          msgBox.className = 'msg error'; msgBox.textContent = ex.message; msgBox.style.display='block';
          btn.disabled=false; btn.textContent='Réinitialiser';
        }
      }
    });
  </script>
</body>
</html>
