<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Scanner AHH</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --g1:#1b5e20;--g2:#2e7d32;--g3:#43a047;
    --ok:#2e7d32;--warn:#e65100;--err:#c62828;--dup:#6a1a75;
    --white:#fff;--off:#f4f8f4;--text:#1a2e1a;--border:#c8e6c9;
  }
  html,body{height:100%;overflow:hidden;background:#111;font-family:'Segoe UI',Arial,sans-serif}

  /* ── HEADER ── */
  .hdr{
    background:linear-gradient(135deg,var(--g1),var(--g2));
    padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:10;position:relative;
  }
  .hdr-logo{display:flex;align-items:center;gap:10px}
  .hdr-logo img{width:36px;height:36px;border-radius:8px;object-fit:cover;border:2px solid rgba(255,255,255,.3)}
  .hdr-title{color:#fff;font-size:.95rem;font-weight:700;line-height:1.1}
  .hdr-sub{color:rgba(255,255,255,.65);font-size:.68rem;font-weight:400}
  .hdr-user{color:rgba(255,255,255,.8);font-size:.75rem;text-align:right}
  .btn-logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;
    padding:5px 12px;border-radius:20px;cursor:pointer;font-size:.72rem;margin-top:4px}
  .btn-logout:hover{background:rgba(255,255,255,.25)}

  /* ── MAIN LAYOUT ── */
  .main{display:flex;height:calc(100vh - 58px);gap:0}

  /* ── LEFT: CAMERA ── */
  .cam-side{
    flex:1;display:flex;flex-direction:column;background:#000;position:relative;min-width:0;
  }
  .cam-wrap{
    flex:1;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  #reader{width:100%;height:100%}
  #reader video{width:100%!important;height:100%!important;object-fit:cover}

  /* Viseur animé */
  .viewfinder{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:220px;height:220px;pointer-events:none;z-index:5;
  }
  .vf-corner{position:absolute;width:36px;height:36px;border-color:#fff;border-style:solid;}
  .vf-tl{top:0;left:0;border-width:4px 0 0 4px;border-radius:4px 0 0 0}
  .vf-tr{top:0;right:0;border-width:4px 4px 0 0;border-radius:0 4px 0 0}
  .vf-bl{bottom:0;left:0;border-width:0 0 4px 4px;border-radius:0 0 0 4px}
  .vf-br{bottom:0;right:0;border-width:0 4px 4px 0;border-radius:0 0 4px 0}
  .vf-scan{
    position:absolute;left:4px;right:4px;height:2px;
    background:linear-gradient(90deg,transparent,#4caf50,transparent);
    animation:scan 2s linear infinite;
  }
  @keyframes scan{0%{top:4px}100%{top:calc(100% - 6px)}}
  .cam-tip{
    padding:10px 16px;background:#000;color:rgba(255,255,255,.6);
    text-align:center;font-size:.75rem;
  }

  /* Filtre activité */
  .act-filter{
    padding:8px 12px;background:#111;
    display:flex;align-items:center;gap:8px;border-top:1px solid #222;
  }
  .act-filter label{color:rgba(255,255,255,.6);font-size:.72rem;white-space:nowrap}
  .act-filter select{
    flex:1;background:#222;color:#fff;border:1px solid #444;border-radius:6px;
    padding:5px 8px;font-size:.78rem;
  }

  /* ── RIGHT: RESULT ── */
  .result-side{
    width:340px;flex-shrink:0;background:#1a1a1a;
    display:flex;flex-direction:column;border-left:1px solid #333;
  }
  .result-header{
    padding:12px 16px;background:#111;border-bottom:1px solid #2a2a2a;
    color:rgba(255,255,255,.5);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  }

  /* Résultat principal */
  .result-main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 20px;transition:.3s;
  }
  .result-main.ok   {background:rgba(46,125,50,.15)}
  .result-main.warn {background:rgba(230,81,0,.15)}
  .result-main.err  {background:rgba(198,40,40,.15)}
  .result-main.dup  {background:rgba(106,26,117,.15)}
  .result-main.vip  {background:rgba(26,35,126,.15)}

  .result-icon{font-size:4rem;margin-bottom:12px;line-height:1}
  .result-status{font-size:1rem;font-weight:700;letter-spacing:.05em;margin-bottom:20px;text-transform:uppercase}
  .ok   .result-status{color:#66bb6a}
  .warn .result-status{color:#ff9800}
  .err  .result-status{color:#ef5350}
  .dup  .result-status{color:#ce93d8}
  .vip  .result-status{color:#90caf9}

  .result-name{
    font-size:2rem;font-weight:800;color:#fff;text-align:center;
    line-height:1.2;margin-bottom:8px;
  }
  .result-table{
    font-size:1.5rem;font-weight:700;color:#a5d6a7;margin-bottom:16px;
  }
  .result-badge{
    background:rgba(255,255,255,.1);border-radius:20px;padding:6px 16px;
    font-size:.82rem;color:rgba(255,255,255,.8);margin-bottom:6px;
    display:flex;align-items:center;gap:6px;
  }
  .result-activity{font-size:.78rem;color:rgba(255,255,255,.45);margin-top:12px;text-align:center}

  /* Historique avec scroll */
  .history{padding:0 12px 12px;flex:1;overflow-y:auto;min-height:0}
  .history-title{font-size:.68rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.05em;padding:8px 4px 6px;font-weight:600}
  .hist-item{
    background:rgba(255,255,255,.06);border-radius:8px;padding:8px 10px;
    margin-bottom:6px;display:flex;align-items:center;gap:10px;
  }
  .hist-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .hist-dot.ok{background:#66bb6a}
  .hist-dot.dup{background:#ce93d8}
  .hist-dot.err{background:#ef5350}
  .hist-dot.vip{background:#90caf9}
  .hist-dot.warn{background:#ff9800}

  /* Member photo in overlay/result */
  .ov-photo{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.5);margin-bottom:10px}
  .result-photo{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.3);margin-bottom:8px}
  .ov-plan-badge{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 14px;font-size:.82rem;color:rgba(255,255,255,.9);margin-bottom:6px}
  .ov-billets{font-size:.88rem;color:rgba(255,255,255,.75);margin-top:4px}
  .hist-info{flex:1;min-width:0}
  .hist-name{font-size:.78rem;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist-meta{font-size:.68rem;color:rgba(255,255,255,.45)}

  /* Idle state */
  .idle{text-align:center;color:rgba(255,255,255,.3)}
  .idle-icon{font-size:3rem;margin-bottom:12px}
  .idle p{font-size:.88rem}

  /* ── MOBILE : caméra 55% + résultat 45%, tout visible sans scroller ── */
  @media(max-width:640px){
    /* Header ultra-compact */
    .hdr{padding:5px 10px}
    .hdr-logo img{width:26px;height:26px}
    .hdr-title{font-size:.78rem}
    .hdr-sub,.hdr-user{display:none}
    .btn-logout{padding:3px 8px;font-size:.62rem;margin-top:0}

    /* Layout colonne, hauteur fixe, 0 scroll */
    .main{
      display:flex;flex-direction:column;
      height:calc(100vh - 40px);overflow:hidden;
    }

    /* Caméra : 55% de l'espace */
    .cam-side{flex:0 0 55%;min-height:0}
    .cam-tip{display:none}
    .act-filter{padding:4px 8px}
    .act-filter label{font-size:.65rem}
    .act-filter select{font-size:.72rem;padding:3px 6px}
    .viewfinder{width:160px;height:160px}

    /* Résultat : 45% restants, compact */
    .result-side{
      display:flex;flex-direction:column;
      flex:0 0 45%;width:100%;min-height:0;
      border-left:none;border-top:2px solid #333;
    }
    .result-header{padding:6px 12px;font-size:.65rem}
    .result-main{padding:10px 14px}
    .result-icon{font-size:2.4rem;margin-bottom:4px}
    .result-status{font-size:.8rem;margin-bottom:8px}
    .result-name{font-size:1.4rem;margin-bottom:4px}
    .result-table{font-size:1.1rem;margin-bottom:6px}
    .result-badge{font-size:.72rem;padding:4px 10px}
    .result-activity{font-size:.68rem;margin-top:4px}
    .idle-icon{font-size:1.8rem;margin-bottom:6px}
    .idle p{font-size:.75rem}

    /* Historique : visible sur mobile avec scroll */
    .history{display:block;max-height:120px;overflow-y:auto;padding:0 8px 8px}
    .hist-item{padding:5px 8px;margin-bottom:3px}
    .hist-name{font-size:.7rem}
    .hist-meta{font-size:.6rem}
  }

  /* ── Overlay résultat plein écran (mobile + desktop) ── */
  #scanOverlay{
    display:none;position:fixed;inset:0;z-index:500;
    flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px 20px;
  }
  #scanOverlay.visible{display:flex}
  #scanOverlay.ok  {background:#1b5e20}
  #scanOverlay.dup {background:#4a0072}
  #scanOverlay.err {background:#b71c1c}
  #scanOverlay.warn{background:#bf360c}
  #scanOverlay.vip {background:#1a237e}
  #scanOverlay .ov-icon{font-size:6rem;margin-bottom:8px;line-height:1}
  #scanOverlay .ov-status{
    font-size:1.2rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:rgba(255,255,255,.85);margin-bottom:20px;
  }
  #scanOverlay .ov-name{
    font-size:2.6rem;font-weight:800;color:#fff;line-height:1.15;
    margin-bottom:10px;text-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  #scanOverlay .ov-sub{
    font-size:1rem;color:rgba(255,255,255,.8);margin-bottom:28px;
    background:rgba(0,0,0,.2);padding:8px 16px;border-radius:20px;
  }
  #scanOverlay .ov-close{
    padding:14px 36px;border:2px solid rgba(255,255,255,.5);
    border-radius:30px;color:#fff;background:rgba(255,255,255,.15);
    cursor:pointer;font-size:1rem;font-weight:600;font-family:inherit;
    backdrop-filter:blur(4px);
  }

  /* Bannière legacy — non utilisée sur mobile maintenant */
  #scanBanner{display:none!important}
</style>
</head>
<body>

<!-- Overlay résultat plein écran -->
<div id="scanOverlay">
  <div class="ov-icon" id="ovIcon"></div>
  <div class="ov-status" id="ovStatus"></div>
  <div class="ov-name" id="ovName"></div>
  <div class="ov-sub" id="ovSub"></div>
  <button class="ov-close" onclick="closeOverlay()">Continuer le scan</button>
</div>

<div id="scanBanner"></div>

<div class="hdr">
  <div class="hdr-logo">
    <img src="Public/logo1.png" alt="AHH"/>
    <div>
      <div class="hdr-title">Scanner AHH</div>
      <div class="hdr-sub">Association Haïtienne de Hamilton</div>
    </div>
  </div>
  <div class="hdr-user">
    <div id="hdUser">–</div>
    <div style="display:flex;gap:4px;margin-top:3px">
      <button class="btn-logout" onclick="location.href='dashboard/app.html'">← Quitter</button>
      <button class="btn-logout" onclick="logout()">Déco</button>
    </div>
  </div>
</div>

<div class="main">
  <!-- Caméra -->
  <div class="cam-side">
    <div class="cam-wrap">
      <div id="reader"></div>
      <div class="viewfinder">
        <div class="vf-corner vf-tl"></div>
        <div class="vf-corner vf-tr"></div>
        <div class="vf-corner vf-bl"></div>
        <div class="vf-corner vf-br"></div>
        <div class="vf-scan"></div>
      </div>
    </div>
    <div class="act-filter">
      <label>Activité :</label>
      <select id="actSelect">
        <option value="">Toutes les activités</option>
      </select>
    </div>
    <div class="cam-tip">📱 Pointez la caméra vers un QR code (billet ou carte membre)</div>
    <div style="padding:6px 10px;display:flex;gap:6px;background:#222">
      <input id="manualCode" placeholder="Saisie manuelle : AHH-XXXXXX ou AHH-00001-..." style="flex:1;padding:6px 10px;border-radius:6px;border:1px solid #555;background:#333;color:#fff;font-size:.8rem;font-family:monospace" onkeydown="if(event.key==='Enter'){event.preventDefault();_manualScan();}"/>
      <button onclick="_manualScan()" style="background:#2e7d32;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-weight:700;font-size:.8rem;cursor:pointer">OK</button>
    </div>
  </div>

  <!-- Résultat -->
  <div class="result-side">
    <div class="result-header">Dernier scan</div>
    <div class="result-main idle" id="resultMain">
      <div class="idle-icon">📷</div>
      <p class="idle">En attente d'un scan…</p>
    </div>
    <div class="history" id="historyBox" style="display:none">
      <div class="history-title">Historique de la session</div>
      <div id="histList"></div>
    </div>
  </div>
</div>

<!-- Sons -->
<audio id="sndOk"  src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" preload="auto"></audio>
<audio id="sndErr" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" preload="auto"></audio>

<script>
const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost:3001/api' : '/api';
let TOKEN = localStorage.getItem('ahh_token');
let USER  = null;
let scanner = null;
let scanning = false;
let lastQR = '';
let history = [];

// ── Auth ────────────────────────────────────────────────────────────────────
if (!TOKEN) { location.href = 'dashboard/login.html'; }

let myDelegations = [];

(async function init() {
  try {
    const r = await fetch(API + '/auth/me', { headers: { Authorization: 'Bearer ' + TOKEN } });
    if (!r.ok) { location.href = 'dashboard/login.html'; return; }
    USER = await r.json();
    const execRoles = ['admin','delegue','secretaire','tresoriere'];
    const isExec = execRoles.includes(USER.role);

    if (!isExec) {
      // Membre normal : vérifier les délégations
      try {
        const dr = await fetch(API + '/scan-delegations/my', { headers: { Authorization: 'Bearer ' + TOKEN } });
        if (dr.ok) myDelegations = await dr.json();
      } catch {}
      if (!myDelegations || myDelegations.length === 0) {
        document.body.innerHTML = '<div style="color:#fff;text-align:center;padding:40px"><h2>Accès refusé</h2><p>Vous n\'avez pas l\'autorisation de scanner.<br>Demandez à un membre du comité de vous déléguer l\'accès.</p></div>';
        return;
      }
    }

    var scanLabel = USER.role;
    if (!isExec) {
      var delegTypes = new Set(myDelegations.map(function(d) { return d.type; }));
      if (delegTypes.has('tous')) scanLabel = 'délégué(e) — billets + cartes';
      else if (delegTypes.has('billets') && delegTypes.has('cartes')) scanLabel = 'délégué(e) — billets + cartes';
      else if (delegTypes.has('billets')) scanLabel = 'délégué(e) — billets';
      else if (delegTypes.has('cartes')) scanLabel = 'délégué(e) — cartes';
      else scanLabel = 'délégué(e)';
    }
    document.getElementById('hdUser').textContent = USER.prenom + ' ' + USER.nom + ' · ' + scanLabel;
    await loadActivities();
    startScanner();
  } catch(e) {
    location.href = 'dashboard/login.html';
  }
})();

function logout() {
  if (scanner) scanner.stop().catch(()=>{});
  localStorage.removeItem('ahh_token');
  localStorage.removeItem('ahh_user');
  location.href = 'dashboard/login.html';
}

// ── Activités ────────────────────────────────────────────────────────────────
async function loadActivities() {
  try {
    const r = await fetch(API + '/activities', { headers: { Authorization: 'Bearer ' + TOKEN } });
    const acts = await r.json();
    const sel = document.getElementById('actSelect');
    const execRoles = ['admin','delegue','secretaire','tresoriere'];
    const isExec = execRoles.includes(USER.role);

    // Pour les membres délégués : filtrer les activités selon les délégations
    const delegatedActIds = myDelegations.map(d => d.activity_id).filter(Boolean);
    const hasGlobalDelegation = myDelegations.some(d => !d.activity_id);

    let filteredActs = acts.filter(a => a.statut !== 'terminee');
    if (!isExec && !hasGlobalDelegation) {
      filteredActs = filteredActs.filter(a => delegatedActIds.includes(a.id));
      // Pas d'option "Toutes les activités" pour les délégués limités
      if (filteredActs.length > 0) sel.innerHTML = '';
    }

    filteredActs.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.titre + (a.date_debut ? ' · ' + new Date(a.date_debut).toLocaleDateString('fr-CA') : '');
      sel.appendChild(opt);
    });

    // Auto-sélection si un seul choix ou via URL
    if (!isExec && !hasGlobalDelegation && filteredActs.length === 1) {
      sel.value = filteredActs[0].id;
    }
    const urlActId = new URLSearchParams(window.location.search).get('activity_id');
    if (urlActId) sel.value = urlActId;
  } catch(e) {}
}

// ── Scanner ───────────────────────────────────────────────────────────────────
function startScanner() {
  scanner = new Html5Qrcode('reader');
  const config = {
    fps: 30,
    qrbox: { width: 260, height: 260 },
    aspectRatio: 1.0,
    disableFlip: false,
    experimentalFeatures: { useBarCodeDetectorIfSupported: false }
  };

  // Essai 1 : caméra arrière exacte (Android Chrome)
  scanner.start({ facingMode: { exact: 'environment' } }, config, onQRDetected, () => {})
    .catch(() => {
      // Essai 2 : caméra arrière préférée (iOS Safari + Chrome)
      scanner.start({ facingMode: 'environment' }, config, onQRDetected, () => {})
        .catch(() => {
          // Essai 3 : n'importe quelle caméra
          scanner.start({ facingMode: 'user' }, config, onQRDetected, () => {})
            .catch(() => {
              // Essai 4 : laisser le navigateur choisir
              scanner.start(null, config, onQRDetected, () => {})
                .catch(err => {
                  const tip = document.querySelector('.cam-tip');
                  if (tip) { tip.textContent = '⚠️ Caméra inaccessible. Autorisez l\'accès dans les réglages.'; tip.style.color = '#ef5350'; }
                });
            });
        });
    });
}

function _scanMarkPresent(actId, userId) {
  fetch(API + '/carte-scan/presencer', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
    body: JSON.stringify({ user_id: userId, activity_id: actId })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.ok || d.already_in) {
      var btn = event.target;
      btn.outerHTML = '<span style="color:#66bb6a;font-size:.68rem">✅ Présent</span>';
    }
  }).catch(function() {});
}

function _manualScan() {
  var input = document.getElementById('manualCode');
  var val = (input ? input.value : '').trim();
  if (!val) return;
  input.value = '';
  onQRDetected(val);
}

// ── QR Détecté ───────────────────────────────────────────────────────────────
async function onQRDetected(rawText) {
  if (rawText === lastQR) return;
  lastQR = rawText;
  setTimeout(function() { lastQR = ''; }, 2000); // cooldown 2s

  // Normaliser :
  // 1. URL scan.html?t=TOKEN → TICKET:TOKEN
  // 2. Code128 AHH-XXXXXX → envoyé tel quel (barcode_data)
  // 3. Carte AHH-00001-xxx → envoyé tel quel (unified détecte)
  var qrText = rawText;
  var urlMatch = rawText.match(/[?&]t=([^&\s]+)/);
  if (urlMatch) {
    qrText = 'TICKET:' + urlMatch[1];
  }

  var actId = document.getElementById('actSelect').value || null;
  var box = document.getElementById('resultMain');
  box.innerHTML = '<div class="idle-icon" style="animation:spin .5s linear infinite">⏳</div>';

  try {
    var res = await fetch(API + '/scan/unified', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
      body: JSON.stringify({ qr_data: qrText, activity_id: actId ? parseInt(actId) : undefined })
    });
    var data = await res.json();

    if (data.type === 'ticket') {
      // ── Ticket result ──
      if (!data.ok && data.status === 'invalide') {
        showResultUnified('warn', '⚠️', data.message || 'BILLET INVALIDE', data);
        playBeep(false);
        addHistory('err', data.nom || 'Inconnu', data.message || 'Invalide', data);
      } else if (data.status === 'deja_scanne') {
        showResultUnified('dup', '🔄', 'DÉJÀ ENTRÉ', data);
        playBeep(false);
        addHistory('dup', data.nom, 'Déjà scanné' + (data.table_numero ? ', table ' + data.table_numero : ''), data);
      } else if (data.ok) {
        showResultUnified('ok', '✅', 'BIENVENUE', data);
        playBeep(true);
        addHistory('ok', data.nom, (data.table_numero ? 'Table ' + data.table_numero + ', ' : '') + (data.vendu_en_ligne ? 'En ligne' : 'Vendu par ' + (data.vendeur_nom || '?')), data);
      } else {
        showResultUnified('err', '❌', data.message || 'ERREUR', data);
        playBeep(false);
        addHistory('err', data.nom || 'Inconnu', data.message || 'Erreur', data);
      }
    } else if (data.type === 'carte') {
      // ── Card result ──
      if (data.status === 'vip') {
        showResultUnified('vip', '👑', 'VIP — COMITÉ', data);
        playBeep(true);
        addHistory('vip', data.nom, 'Comité VIP', data);
      } else if (data.status === 'deja_scanne') {
        showResultUnified('dup', '🔄', 'DÉJÀ ENTRÉ(E)', data);
        playBeep(false);
        addHistory('dup', data.nom, 'Déjà entré(e)', data);
      } else if (data.ok) {
        showResultUnified('ok', '✅', 'BIENVENUE', data);
        playBeep(true);
        var histMeta = data.plan ? (data.plan.charAt(0).toUpperCase() + data.plan.slice(1)) : 'Membre';
        if (data.total_billets > 0) histMeta += ', ' + data.billets_restants + '/' + data.total_billets + ' billets';
        addHistory('ok', data.nom, histMeta, data);
      } else {
        showResultUnified(data.status === 'invalide' ? 'warn' : 'err', '⚠️', data.message || 'INVALIDE', data);
        playBeep(false);
        addHistory('err', data.nom || 'Inconnu', data.message || 'Invalide', data);
      }
    } else {
      // ── Error / not found ──
      showResultUnified('err', '❌', data.message || 'QR NON RECONNU', data);
      playBeep(false);
      addHistory('err', qrText.split('\n')[0] || 'Inconnu', data.message || 'Non reconnu', data);
    }
  } catch(e) {
    showResultUnified('err', '⚠️', 'ERREUR RÉSEAU', { nom: 'Vérifiez la connexion', type: 'error' });
    playBeep(false);
  }
}

var _overlayTimer = null;
function closeOverlay() {
  var o = document.getElementById('scanOverlay');
  o.classList.remove('visible');
  lastQR = ''; // réinitialiser cooldown pour re-scanner
}

function showResultUnified(cls, icon, statusText, data) {
  var type = data.type || 'error';
  var nom = data.nom || '';
  var icons = { ok:'✅', dup:'🔄', err:'❌', warn:'⚠️', vip:'👑' };

  // ── Overlay plein écran ──
  var o = document.getElementById('scanOverlay');
  o.className = 'visible ' + cls;
  document.getElementById('ovIcon').innerHTML = (type === 'carte' && data.photo_url)
    ? '<img class="ov-photo" src="' + data.photo_url + '" onerror="this.outerHTML=\'' + (icons[cls] || icon) + '\'">'
    : (icons[cls] || icon);
  document.getElementById('ovStatus').textContent = statusText;
  document.getElementById('ovName').textContent = nom;

  var subParts = [];
  if (type === 'ticket') {
    if (data.table_numero) subParts.push('🪑 Table ' + data.table_numero);
    if (data.vendeur_nom) subParts.push('👤 ' + data.vendeur_nom);
    else if (data.vendu_en_ligne) subParts.push('🌐 En ligne');
    if (data.activite) subParts.push('🎉 ' + data.activite);
    if (data.prix) subParts.push('💵 ' + parseFloat(data.prix).toFixed(2) + ' $');
  } else if (type === 'carte') {
    if (data.plan) subParts.push('🪪 ' + data.plan.charAt(0).toUpperCase() + data.plan.slice(1));
    if (data.is_comite) subParts.push('⭐ Comité');
    if (data.activite) subParts.push('🎉 ' + data.activite);
    if (typeof data.total_billets === 'number' && data.total_billets > 0)
      subParts.push('🎟 ' + data.billets_restants + '/' + data.total_billets + ' billets');
    if (data.carte_valide === false && cls !== 'vip') subParts.push('⚠️ Carte invalide');
  }
  document.getElementById('ovSub').innerHTML = subParts.join(' · ');

  clearTimeout(_overlayTimer);
  _overlayTimer = setTimeout(closeOverlay, (cls === 'ok' || cls === 'dup' || cls === 'vip') ? 4000 : 3000);

  // ── Panel desktop (result-side) ──
  var box = document.getElementById('resultMain');
  box.className = 'result-main ' + cls;

  if (type === 'ticket') {
    var achatInfo = data.vendeur_nom
      ? '<div class="result-badge">👤 Vendu par ' + data.vendeur_nom + '</div>'
      : '<div class="result-badge">🌐 Acheté en ligne</div>';
    box.innerHTML =
      '<div class="result-icon">' + icon + '</div>' +
      '<div class="result-status">' + statusText + '</div>' +
      '<div class="result-name">' + nom + '</div>' +
      (data.table_numero ? '<div class="result-table">🪑 Table ' + data.table_numero + '</div>' : '<div class="result-table" style="color:rgba(255,255,255,.4)">Table non assignée</div>') +
      achatInfo +
      (data.activite ? '<div class="result-activity">' + data.activite + '</div>' : '') +
      (data.status === 'deja_scanne' ? '<div class="result-badge" style="background:rgba(206,147,216,.2);margin-top:8px">⚠️ Ce billet a déjà été scanné</div>' : '');
  } else if (type === 'carte') {
    var photoHtml = data.photo_url
      ? '<img class="result-photo" src="' + data.photo_url + '" onerror="this.style.display=\'none\'">'
      : '';
    var planLabel = data.plan ? data.plan.charAt(0).toUpperCase() + data.plan.slice(1) : 'Gratuit';
    var carteStatusHtml = '';
    if (data.carte_valide === false && cls !== 'vip') carteStatusHtml = '<div class="result-badge" style="background:rgba(255,152,0,.2)">⚠️ Carte invalide</div>';
    else if (data.carte_valide) carteStatusHtml = '<div class="result-badge" style="background:rgba(76,175,80,.2)">✅ Carte valide</div>';
    var billetsHtml = '';
    if (typeof data.total_billets === 'number' && data.total_billets > 0)
      billetsHtml = '<div class="result-badge">🎟 ' + data.billets_restants + ' billet(s) restant(s) sur ' + data.total_billets + '</div>';
    var vipBadge = data.is_comite ? '<div class="result-badge" style="background:rgba(26,35,126,.3);color:#90caf9">⭐ Comité — VIP</div>' : '';
    // Activités du membre
    var actsHtml = '';
    if (data.activities && data.activities.length) {
      actsHtml = '<div style="margin-top:12px;border-top:1px solid rgba(255,255,255,.15);padding-top:8px;max-height:160px;overflow-y:auto">' +
        '<div style="font-size:.65rem;color:rgba(255,255,255,.4);text-transform:uppercase;margin-bottom:4px">Activités</div>';
      data.activities.forEach(function(a) {
        var isPresent = a.reg_checked_in === 1;
        var isRegistered = !!a.reg_statut;
        var statusIcon = isPresent ? '✅' : (isRegistered ? '📝' : (a.nb_billets > 0 ? '🎟' : ''));
        actsHtml += '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:.75rem">' +
          '<span>' + statusIcon + '</span>' +
          '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(255,255,255,.8)">' + (a.titre||'') + '</span>' +
          (isPresent ? '<span style="color:#66bb6a;font-size:.68rem">Présent</span>'
            : (data.member_id ? '<button onclick="_scanMarkPresent(' + a.id + ',' + data.member_id + ')" style="background:rgba(46,125,50,.3);color:#66bb6a;border:none;border-radius:4px;padding:2px 8px;font-size:.65rem;cursor:pointer">Présent</button>' : '')) +
        '</div>';
      });
      actsHtml += '</div>';
    }

    box.innerHTML =
      photoHtml +
      '<div class="result-icon">' + icon + '</div>' +
      '<div class="result-status">' + statusText + '</div>' +
      '<div class="result-name">' + nom + '</div>' +
      '<div class="result-badge">🪪 ' + planLabel + '</div>' +
      vipBadge + carteStatusHtml + billetsHtml +
      (data.activite ? '<div class="result-activity">' + data.activite + '</div>' : '') +
      (data.status === 'deja_scanne' ? '<div class="result-badge" style="background:rgba(206,147,216,.2);margin-top:8px">🔄 Déjà entré(e)</div>' : '') +
      actsHtml;
  } else {
    // Error / unknown
    box.innerHTML =
      '<div class="result-icon">' + icon + '</div>' +
      '<div class="result-status">' + statusText + '</div>' +
      '<div class="result-name">' + nom + '</div>';
  }
}

// ── Historique ────────────────────────────────────────────────────────────────
function addHistory(type, nom, meta, fullData) {
  history.unshift({ type, nom, meta, fullData: fullData || {}, time: new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}) });
  if (history.length > 20) history.pop();

  var box = document.getElementById('historyBox');
  var list = document.getElementById('histList');
  box.style.display = 'block';
  list.innerHTML = history.map(function(h, i) {
    return '<div class="hist-item" style="cursor:pointer" onclick="_replayHistory(' + i + ')">' +
      '<div class="hist-dot ' + h.type + '"></div>' +
      '<div class="hist-info">' +
        '<div class="hist-name">' + h.nom + '</div>' +
        '<div class="hist-meta">' + h.time + ' · ' + h.meta + '</div>' +
      '</div>' +
      '<div style="color:rgba(255,255,255,.3);font-size:.7rem">›</div>' +
    '</div>';
  }).join('');
}

function _replayHistory(idx) {
  var h = history[idx];
  if (!h || !h.fullData) return;
  var d = h.fullData;
  var o = document.getElementById('scanOverlay');
  var cls = h.type === 'vip' ? 'vip' : h.type;
  o.className = 'visible ' + cls;
  document.getElementById('ovIcon').textContent = cls === 'ok' ? '✅' : cls === 'dup' ? '🔄' : cls === 'vip' ? '👑' : '❌';
  document.getElementById('ovStatus').textContent = d.status === 'vip' ? 'VIP — COMITÉ' : d.status === 'valide' ? 'VALIDE' : d.status === 'deja_scanne' ? 'DÉJÀ SCANNÉ' : d.status || 'ERREUR';
  document.getElementById('ovName').textContent = d.nom || h.nom || '';

  var rows = [];
  if (d.activite) rows.push('<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.15)"><span style="opacity:.7">Activité</span><strong>' + d.activite + '</strong></div>');
  if (d.barcode) rows.push('<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.15)"><span style="opacity:.7">Billet</span><strong style="font-family:monospace">' + d.barcode + '</strong></div>');
  if (d.plan) rows.push('<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.15)"><span style="opacity:.7">Plan</span><strong>' + d.plan + '</strong></div>');
  if (d.total_billets > 0) rows.push('<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.15)"><span style="opacity:.7">Billets</span><strong>' + (d.total_billets - (d.billets_restants||0)) + '/' + d.total_billets + ' utilisés</strong></div>');
  if (d.table_numero) rows.push('<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.15)"><span style="opacity:.7">Table</span><strong>' + d.table_numero + '</strong></div>');
  if (d.prix) rows.push('<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.15)"><span style="opacity:.7">Prix</span><strong>' + d.prix.toFixed(2) + ' $</strong></div>');
  if (d.lieu) rows.push('<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.15)"><span style="opacity:.7">Lieu</span><strong>' + d.lieu + '</strong></div>');

  document.getElementById('ovDetails').innerHTML = rows.length ? '<div style="background:rgba(0,0,0,.2);border-radius:14px;padding:8px 14px;margin:8px 0;font-size:.85rem;text-align:left">' + rows.join('') + '</div>' : '';
  document.getElementById('ovSub').textContent = h.time;
  clearTimeout(_overlayTimer);
}

// ── Son ───────────────────────────────────────────────────────────────────────
function playBeep(success) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = success ? 880 : 300;
    osc.type = success ? 'sine' : 'square';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (success ? 0.3 : 0.5));
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + (success ? 0.3 : 0.5));
    if (success) {
      setTimeout(() => {
        const o2 = ctx.createOscillator();
        const g2 = ctx.createGain();
        o2.connect(g2); g2.connect(ctx.destination);
        o2.frequency.value = 1200; o2.type = 'sine';
        g2.gain.setValueAtTime(0.2, ctx.currentTime);
        g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
        o2.start(ctx.currentTime); o2.stop(ctx.currentTime + 0.25);
      }, 150);
    }
  } catch(e) {}
}

// Vibration si supporté
function vibrate(ok) {
  if (navigator.vibrate) navigator.vibrate(ok ? [100] : [100, 50, 100]);
}
