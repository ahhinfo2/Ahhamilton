<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page introuvable | AHH</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Poppins',sans-serif;
      min-height:100vh;
      background:linear-gradient(160deg,#0a1a30 0%,#001836 40%,#1a0010 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px;text-align:center;color:#fff;overflow:hidden;position:relative;
    }

    /* Étoiles animées */
    .stars{position:absolute;inset:0;pointer-events:none;z-index:0}
    .star{
      position:absolute;background:#fff;border-radius:50%;
      animation:twinkle 2.5s ease-in-out infinite;
    }
    @keyframes twinkle{0%,100%{opacity:.08;transform:scale(1)}50%{opacity:.9;transform:scale(1.6)}}

    /* Particules drapeau */
    .flag-dot{
      position:absolute;border-radius:50%;pointer-events:none;
      animation:float-dot linear infinite;
    }
    @keyframes float-dot{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:.6}90%{opacity:.4}100%{transform:translateY(-20vh) rotate(720deg);opacity:0}}

    /* Carte principale */
    .card{
      position:relative;z-index:1;
      background:rgba(255,255,255,.07);
      backdrop-filter:blur(20px) saturate(160%);
      -webkit-backdrop-filter:blur(20px) saturate(160%);
      border:1px solid rgba(255,255,255,.15);
      border-radius:28px;padding:52px 44px;max-width:520px;width:100%;
      box-shadow:0 32px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1);
    }

    /* Illustration flottante */
    .illustration{
      font-size:6rem;margin-bottom:8px;display:block;
      animation:float-illus 3.2s ease-in-out infinite;
      filter:drop-shadow(0 8px 24px rgba(249,168,37,.25));
    }
    @keyframes float-illus{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-18px) rotate(2deg)}}

    /* Code 404 derrière */
    .big-code{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);
      font-size:min(22vw,160px);font-weight:900;line-height:1;
      background:linear-gradient(135deg,rgba(0,63,135,.18),rgba(210,16,52,.12));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;pointer-events:none;user-select:none;
    }

    h1{font-size:1.9rem;font-weight:800;margin-bottom:10px;letter-spacing:-.02em}
    .sub{
      font-family:'Playfair Display',serif;font-style:italic;
      color:rgba(255,255,255,.65);font-size:1rem;margin-bottom:24px;line-height:1.6;
    }
    p{color:rgba(255,255,255,.7);font-size:.88rem;line-height:1.7;margin-bottom:32px;max-width:360px;margin-left:auto;margin-right:auto}

    /* Séparateur drapeau */
    .flag-bar{height:3px;border-radius:2px;margin:0 auto 28px;width:80px;
      background:linear-gradient(90deg,#003F87 0%,#003F87 50%,#D21034 50%,#D21034 100%)}

    .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .btn{
      padding:11px 20px;border-radius:12px;
      font-family:'Poppins',sans-serif;font-size:.84rem;font-weight:700;
      cursor:pointer;border:none;text-decoration:none;
      transition:transform .2s,box-shadow .2s;
      display:inline-flex;align-items:center;gap:6px;
    }
    .btn-white{background:#fff;color:#0a1a30;box-shadow:0 4px 16px rgba(255,255,255,.15)}
    .btn-white:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,255,255,.2)}
    .btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.25)}
    .btn-ghost:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}

    /* Tip bas */
    .tip{position:absolute;bottom:20px;font-size:.72rem;color:rgba(255,255,255,.3);z-index:1}
    .emoji-icon{display:inline-block;width:1.15em;height:1.15em;vertical-align:-0.2em;color:inherit}
  </style>
</head>
<body>

  <!-- Étoiles -->
  <div class="stars" id="stars"></div>

  <div class="big-code">404</div>

  <div class="card">
    <span class="illustration"><svg class="emoji-icon"><use href="/icons.svg#map"/></svg></span>
    <h1>Page introuvable</h1>
    <div class="flag-bar"></div>
    <p class="sub">"Depi nan Ginen, nou rele Ayisyen."<br><small style="font-size:.75rem;font-style:normal">Depuis les origines, nous sommes Haïtiens.</small></p>
    <p>La page que vous cherchez n'existe pas ou a été déplacée. Mais notre communauté, elle, vous attend toujours !</p>
    <div class="links">
      <a href="/index.html" class="btn btn-white"><svg class="emoji-icon"><use href="/icons.svg#home"/></svg> Accueil</a>
      <a href="/actualites.html" class="btn btn-ghost"><svg class="emoji-icon"><use href="/icons.svg#calendar"/></svg> Activités</a>
      <a href="/galerie.html" class="btn btn-ghost"><svg class="emoji-icon"><use href="/icons.svg#picture"/></svg> Galerie</a>
      <a href="/adhesion.html" class="btn btn-ghost"><svg class="emoji-icon"><use href="/icons.svg#handshake"/></svg> Rejoindre</a>
    </div>
  </div>

  <div class="tip">Association Haïtienne de Hamilton · ahhamilton.ca</div>

  <script>
    // Étoiles
    var stars = document.getElementById('stars');
    for (var i = 0; i < 80; i++) {
      var s = document.createElement('div');
      s.className = 'star';
      var size = 1 + Math.random() * 3;
      s.style.cssText = [
        'width:' + size + 'px', 'height:' + size + 'px',
        'top:' + Math.random() * 100 + '%', 'left:' + Math.random() * 100 + '%',
        'animation-delay:' + (Math.random() * 3) + 's',
        'animation-duration:' + (1.5 + Math.random() * 3) + 's'
      ].join(';');
      stars.appendChild(s);
    }

    // Particules drapeau flottantes
    var colors = ['#003F87','#D21034','#ffffff'];
    for (var j = 0; j < 12; j++) {
      var p = document.createElement('div');
      p.className = 'flag-dot';
      var sz = 4 + Math.random() * 8;
      p.style.cssText = [
        'width:' + sz + 'px', 'height:' + sz + 'px',
        'background:' + colors[j % 3],
        'left:' + (5 + Math.random() * 90) + '%',
        'animation-duration:' + (6 + Math.random() * 8) + 's',
        'animation-delay:' + (Math.random() * 6) + 's',
        'opacity:.5'
      ].join(';');
      document.body.appendChild(p);
    }
  </script>
</body>
</html>
